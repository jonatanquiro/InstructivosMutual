<!DOCTYPE html>
<html lang="es">

  <title>Enlaces Importantes — Información Mutual</title>
  <link rel="icon" type="image/png" href="/img/logo-mutual.png" />
  <script>
    (function () {
      var t = localStorage.getItem("tema");
      if (t) document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

      <h1>Enlaces Importantes</h1>
      <span class="saludo" id="saludo"></span>

  </header>

  <main>
    <div class="grilla-menu">
      <a class="tarjeta-menu" href="https://mutualclubunion.com.ar/" target="_blank" rel="noopener">
        <span class="tarjeta-icono">🌐</span>
        <span class="tarjeta-titulo">Página Web</span>
        <span class="tarjeta-desc">mutualclubunion.com.ar</span>
      </a>

      <a class="tarjeta-menu" href="https://masunion.com.ar/" target="_blank" rel="noopener">
        <span class="tarjeta-icono">🌐</span>
        <span class="tarjeta-titulo">Página Web TMU</span>
        <span class="tarjeta-desc">masunion.com.ar</span>
      </a>

      <a class="tarjeta-menu" href="https://autogestion.mutualclubunion.com.ar/" target="_blank" rel="noopener">
        <span class="tarjeta-icono">🌐</span>

        <span class="tarjeta-desc">autogestion.mutualclubunion.com.ar</span>

        <span class="tarjeta-icono">✉️</span>
        <span class="tarjeta-titulo">Correo</span>
        <span class="tarjeta-desc">mutualclubunion.insunet.com.ar</span>
      </a>

      <a class="tarjeta-menu" href="https://smpc.cabal.coop/crediware/default.aspx" target="_blank" rel="noopener">
        <span class="tarjeta-icono">💳</span>
        <span class="tarjeta-titulo">Crediware</span>
        <span class="tarjeta-desc">smpc.cabal.coop/crediware</span>
      </a>
    </div>
  </main>

  <footer class="barra-inferior">
    <a href="/" class="btn-inferior principal">⌂ Menú principal</a>
    <button id="btnSalir" class="btn-inferior peligro">Cerrar sesión</button>
  </footer>

  <script src="/comun.js"></script>

</html>
