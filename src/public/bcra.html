<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Situación BCRA — Información Mutual</title>
  <link rel="icon" type="image/png" href="/img/logo-mutual.png" />
  <script>
    (function () {
      var t = localStorage.getItem("tema");
      if (t) document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="barra">
    <div class="barra-izq">
      <img src="/img/logo-blanco.png" alt="Logo Mutual" class="logo-barra" />
      <h1>Situación BCRA</h1>
      <span class="saludo" id="saludo"></span>
    </div>
  </header>

  <main>
    <div class="caja-usuarios caja-consulta-bcra">
      <h2>Consultar Central de Deudores</h2>
      <form id="formConsulta" class="form-usuario form-consulta-bcra">
        <div class="error" id="errorConsulta"></div>
        <label for="cuit">CUIT / CUIL</label>
        <input type="text" id="cuit" placeholder="20123456789" inputmode="numeric" required autocomplete="off" />
        <button type="submit" id="btnConsultar">Consultar</button>
      </form>
    </div>

    <div id="resultado" hidden>
      <h2 id="resumenDenominacion"></h2>

      <h3 class="titulo-seccion">Deudas</h3>
      <div class="fila-filtros" id="cajaFiltrosDeudas">
        <label for="selectEntidad">
          Entidad
          <select id="selectEntidad"></select>
        </label>
        <label for="selectPeriodo">
          Período
          <select id="selectPeriodo"></select>
        </label>
      </div>
      <div class="tabla-detalle" id="tablaDeudas"></div>

      <h3 class="titulo-seccion">Total de deuda por período</h3>
      <div class="tabla-detalle" id="tablaTotales"></div>

      <h3 class="titulo-seccion">Cheques Rechazados</h3>
      <div class="tabla-detalle" id="tablaCheques"></div>
    </div>
  </main>

  <footer class="barra-inferior">
    <a href="/enlaces.html" class="btn-inferior principal">◂ Enlaces Útiles</a>
    <button id="btnSalir" class="btn-inferior peligro">Cerrar sesión</button>
  </footer>

  <script src="/comun.js"></script>
  <script>
    const DESCRIPCION_SITUACION = {
      1: "Normal",
      2: "Riesgo bajo",
      3: "Riesgo medio",
      4: "Riesgo alto",
      5: "Irrecuperable",
      6: "Irrecuperable (disp. técnica)",
    };

    function formatearMoneda(numero) {
      return Number(numero || 0).toLocaleString("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 0 });
    }

    function etiquetaPeriodo(periodo) {
      const texto = String(periodo);
      const anio = texto.slice(0, 4);
      const mes = texto.slice(4, 6);
      return `${mes}/${anio}`;
    }

    let periodosActuales = [];
    let entidadesActuales = [];

    function entidadSeleccionada() {
      const indice = document.getElementById("selectEntidad").value;
      return indice === "" ? null : entidadesActuales[Number(indice)];
    }

    // Tabla de detalle: por defecto muestra solo el período más reciente
    // (como antes), pero el filtro de período admite "Todos los períodos"
    // para ver de un saque los 24 meses, y el de entidad para no tener que
    // buscar a mano entre varias financieras.
    function pintarTablaDeudas() {
      const entidad = entidadSeleccionada();
      const filtroPeriodo = document.getElementById("selectPeriodo").value;
      const contenedor = document.getElementById("tablaDeudas");

      const periodos = filtroPeriodo === "" ? periodosActuales : [periodosActuales[Number(filtroPeriodo)]];
      const mostrarColumnaPeriodo = filtroPeriodo === "";

      const filas = [];
      for (const periodo of periodos) {
        for (const e of periodo.entidades) {
          if (entidad && e.entidad !== entidad) continue;
          filas.push({ periodo: periodo.periodo, ...e });
        }
      }

      if (filas.length === 0) {
        contenedor.innerHTML = '<div class="sin-resultados">No hay deudas para este filtro.</div>';
        return;
      }

      const filasHtml = filas
        .map(
          (f) => `
            <tr>
              ${mostrarColumnaPeriodo ? `<td>${etiquetaPeriodo(f.periodo)}</td>` : ""}
              <td>${f.entidad}</td>
              <td><span class="pastilla-situacion pastilla-situacion-${f.situacion}">${f.situacion} — ${f.situacionDescripcion}</span></td>
              <td>${formatearMoneda(f.monto)}</td>
              <td>${f.diasAtrasoPago ? f.diasAtrasoPago + " días" : "—"}</td>
            </tr>
          `
        )
        .join("");

      contenedor.innerHTML = `
        <table class="tabla-usuarios">
          <thead>
            <tr>
              ${mostrarColumnaPeriodo ? "<th>Período</th>" : ""}
              <th>Entidad</th>
              <th>Situación</th>
              <th>Monto</th>
              <th>Días de atraso</th>
            </tr>
          </thead>
          <tbody>${filasHtml}</tbody>
        </table>
      `;
    }

    // Total adeudado por período (sumando todas las entidades, o solo la
    // filtrada), para ver la evolución de la deuda mes a mes sin tener que
    // ir cambiando el período uno por uno.
    function pintarTotalesPorPeriodo() {
      const entidad = entidadSeleccionada();
      const contenedor = document.getElementById("tablaTotales");

      const filas = periodosActuales.map((periodo) => {
        const entidades = entidad ? periodo.entidades.filter((e) => e.entidad === entidad) : periodo.entidades;
        return {
          periodo: periodo.periodo,
          total: entidades.reduce((acc, e) => acc + e.monto, 0),
          cantidad: entidades.length,
        };
      });

      if (filas.every((f) => f.cantidad === 0)) {
        contenedor.innerHTML = '<div class="sin-resultados">Sin datos para este filtro.</div>';
        return;
      }

      const filasHtml = filas
        .map(
          (f) => `
            <tr>
              <td>${etiquetaPeriodo(f.periodo)}</td>
              <td>${formatearMoneda(f.total)}</td>
              <td>${f.cantidad}</td>
            </tr>
          `
        )
        .join("");

      contenedor.innerHTML = `
        <table class="tabla-usuarios">
          <thead>
            <tr>
              <th>Período</th>
              <th>Total adeudado</th>
              <th>Entidades informantes</th>
            </tr>
          </thead>
          <tbody>${filasHtml}</tbody>
        </table>
      `;
    }

    function pintarDeudas(periodos) {
      periodosActuales = periodos;
      const cajaFiltros = document.getElementById("cajaFiltrosDeudas");

      if (periodos.length === 0) {
        cajaFiltros.hidden = true;
        document.getElementById("tablaDeudas").innerHTML =
          '<div class="sin-resultados">Sin deudas informadas en los últimos 24 meses.</div>';
        document.getElementById("tablaTotales").innerHTML = "";
        return;
      }

      cajaFiltros.hidden = false;

      entidadesActuales = [...new Set(periodos.flatMap((p) => p.entidades.map((e) => e.entidad)))].sort((a, b) =>
        a.localeCompare(b, "es")
      );
      const selectEntidad = document.getElementById("selectEntidad");
      selectEntidad.innerHTML =
        '<option value="">Todas las entidades</option>' +
        entidadesActuales.map((e, indice) => `<option value="${indice}">${e}</option>`).join("");
      selectEntidad.value = "";

      // Los períodos vienen del más reciente al más antiguo (hasta 24
      // meses, igual que la web oficial del BCRA).
      const selectPeriodo = document.getElementById("selectPeriodo");
      selectPeriodo.innerHTML =
        '<option value="">Todos los períodos</option>' +
        periodos.map((p, indice) => `<option value="${indice}">${etiquetaPeriodo(p.periodo)}</option>`).join("");
      selectPeriodo.value = "0";

      pintarTablaDeudas();
      pintarTotalesPorPeriodo();
    }

    document.getElementById("selectEntidad").addEventListener("change", () => {
      pintarTablaDeudas();
      pintarTotalesPorPeriodo();
    });
    document.getElementById("selectPeriodo").addEventListener("change", pintarTablaDeudas);

    // Aplana causal -> entidad -> detalle (cada cheque) en filas de tabla,
    // repitiendo el causal solo cuando cambia, para que se lea como una
    // lista agrupada sin perder el formato de tabla simple.
    function pintarCheques(causales) {
      const contenedor = document.getElementById("tablaCheques");
      const filas = [];

      for (const causal of causales) {
        for (const entidad of causal.entidades) {
          for (const cheque of entidad.detalle) {
            filas.push({ causal: causal.causal, entidad: entidad.entidad, ...cheque });
          }
        }
      }

      if (filas.length === 0) {
        contenedor.innerHTML = '<div class="sin-resultados">Sin cheques rechazados registrados.</div>';
        return;
      }

      const filasHtml = filas
        .map(
          (c) => `
            <tr>
              <td>${c.causal || "—"}</td>
              <td>Entidad Nº ${c.entidad ?? "—"}</td>
              <td>${c.nroCheque ?? "—"}</td>
              <td>${c.fechaRechazo || "—"}</td>
              <td>${formatearMoneda(c.monto)}</td>
              <td>${c.fechaPago ? "Pagado el " + c.fechaPago : "Sin pagar"}</td>
              <td>${c.procesoJudicial ? "Sí" : "No"}</td>
            </tr>
          `
        )
        .join("");

      contenedor.innerHTML = `
        <table class="tabla-usuarios">
          <thead>
            <tr>
              <th>Causal</th>
              <th>Entidad</th>
              <th>Nº Cheque</th>
              <th>Fecha rechazo</th>
              <th>Monto</th>
              <th>Estado</th>
              <th>Proceso judicial</th>
            </tr>
          </thead>
          <tbody>${filasHtml}</tbody>
        </table>
      `;
    }

    function pintarResultado(datos) {
      document.getElementById("resumenDenominacion").textContent = datos.denominacion || `CUIT ${datos.identificacion}`;
      pintarDeudas(datos.periodos);
      pintarCheques(datos.chequesRechazados);
      document.getElementById("resultado").hidden = false;
    }

    document.getElementById("formConsulta").addEventListener("submit", async (evento) => {
      evento.preventDefault();

      const cuit = document.getElementById("cuit").value.replace(/\D/g, "");
      const error = document.getElementById("errorConsulta");
      const boton = document.getElementById("btnConsultar");
      error.textContent = "";
      document.getElementById("resultado").hidden = true;

      if (cuit.length !== 11) {
        error.textContent = "Ingresá un CUIT/CUIL válido de 11 dígitos.";
        return;
      }

      boton.disabled = true;
      boton.textContent = "Consultando…";

      try {
        const respuesta = await fetch(`/api/bcra/deudas/${cuit}`);
        if (respuesta.status === 401) {
          window.location.href = "/login.html";
          return;
        }

        const datos = await respuesta.json();

        if (!respuesta.ok) {
          error.textContent = datos.error || "No se pudo completar la consulta.";
          return;
        }

        pintarResultado(datos);
      } catch (e) {
        error.textContent = "No se pudo conectar con el servidor.";
      } finally {
        boton.disabled = false;
        boton.textContent = "Consultar";
      }
    });
  </script>
</body>
</html>
