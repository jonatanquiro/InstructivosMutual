<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Preguntas Frecuentes — Información Mutual</title>
  <link rel="icon" type="image/png" href="/img/logo-mutual.png" />
  <script>
    (function () {
      var t = localStorage.getItem("tema");
      if (t) document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="barra">
    <div class="barra-izq">
      <img src="/img/logo-blanco.png" alt="Logo Mutual" class="logo-barra" />
      <h1>Preguntas Frecuentes</h1>
      <span class="saludo" id="saludo"></span>
    </div>
  </header>

  <main class="main-chat">
    <div class="chat-caja" id="chatCaja"></div>
  </main>

  <footer class="barra-inferior">
    <a href="/" class="btn-inferior principal">⌂ Menú principal</a>
    <button id="btnSalir" class="btn-inferior peligro">Cerrar sesión</button>
  </footer>

  <script src="/comun.js"></script>
  <script>
    let modulos = [];
    let nombreUsuario = "";
    const chatCaja = document.getElementById("chatCaja");

    function scrollAbajo() {
      chatCaja.scrollTop = chatCaja.scrollHeight;
    }

    // Para respuestas largas, no alcanza con "scroll al fondo": el usuario
    // tendría que bajar a mano para leerla entera. En su lugar, llevamos el
    // inicio de la burbuja nueva justo debajo del header, así se lee de
    // arriba hacia abajo sin gestos extra.
    function scrollAlInicioDe(elemento) {
      requestAnimationFrame(() => {
        elemento.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }

    function agregarBurbuja(texto, tipo, llevarVistaAlInicio) {
      const burbuja = document.createElement("div");
      burbuja.className = `burbuja burbuja-${tipo}`;
      burbuja.style.whiteSpace = "pre-wrap";
      burbuja.textContent = texto;
      chatCaja.appendChild(burbuja);

      if (llevarVistaAlInicio) {
        scrollAlInicioDe(burbuja);
      } else {
        scrollAbajo();
      }

      return burbuja;
    }

    function agregarOpciones(opciones, onElegir) {
      const contenedor = document.createElement("div");
      contenedor.className = "burbuja-opciones";

      for (const opcion of opciones) {
        const boton = document.createElement("button");
        boton.className = "btn-opcion-chat";
        boton.textContent = opcion.etiqueta;
        boton.addEventListener("click", () => {
          // Una vez elegida una opción, se deshabilitan todas: no queremos
          // que se puedan re-elegir opciones de un paso ya pasado.
          contenedor.querySelectorAll("button").forEach((b) => (b.disabled = true));
          contenedor.classList.add("opciones-usadas");
          onElegir(opcion);
        });
        contenedor.appendChild(boton);
      }

      chatCaja.appendChild(contenedor);
      scrollAbajo();
    }

    function mostrarModulos() {
      agregarBurbuja("¿Sobre qué módulo te gustaría hacer la consulta?", "bot");

      const modulosConPreguntas = modulos.filter((m) => m.preguntas.length > 0);

      if (modulosConPreguntas.length === 0) {
        agregarBurbuja("Todavía no hay preguntas cargadas.", "bot");
        return;
      }

      agregarOpciones(
        modulosConPreguntas.map((m) => ({ etiqueta: m.nombre, modulo: m })),
        (opcion) => {
          agregarBurbuja(opcion.etiqueta, "usuario");
          mostrarPreguntas(opcion.modulo);
        }
      );
    }

    function mostrarPreguntas(modulo) {
      agregarBurbuja(`Estas son las preguntas de "${modulo.nombre}":`, "bot", true);

      const opciones = modulo.preguntas.map((p) => ({ etiqueta: p.pregunta, pregunta: p }));
      opciones.push({ etiqueta: "◂ Volver a módulos", volver: true });

      agregarOpciones(opciones, (opcion) => {
        if (opcion.volver) {
          agregarBurbuja("Volver a módulos", "usuario");
          mostrarModulos();
          return;
        }

        agregarBurbuja(opcion.etiqueta, "usuario");
        agregarBurbuja(opcion.pregunta.respuesta, "bot", true);
        registrarConsulta(opcion.pregunta.id);
        mostrarSeguirModulo(modulo);
      });
    }

    function mostrarSeguirModulo(modulo) {
      agregarOpciones(
        [
          { etiqueta: `Ver otra pregunta de "${modulo.nombre}"`, seguir: true },
          { etiqueta: "◂ Volver a módulos", volver: true },
        ],
        (opcion) => {
          if (opcion.volver) {
            agregarBurbuja("Volver a módulos", "usuario");
            mostrarModulos();
            return;
          }
          agregarBurbuja(opcion.etiqueta, "usuario");
          mostrarPreguntas(modulo);
        }
      );
    }

    function registrarConsulta(preguntaId) {
      // "Fire and forget": no bloqueamos la interfaz esperando esto.
      fetch(`/api/preguntas/${preguntaId}/consulta`, { method: "POST" }).catch(() => {});
    }

    async function iniciar() {
      try {
        const meRespuesta = await fetch("/api/auth/me");
        if (meRespuesta.ok) {
          const me = await meRespuesta.json();
          nombreUsuario = me.nombreCompleto || "";
        }
      } catch (error) {
        // Si falla, seguimos sin nombre.
      }

      const respuesta = await fetch("/api/modulos");
      if (respuesta.status === 401) {
        window.location.href = "/login.html";
        return;
      }
      modulos = await respuesta.json();
      modulos.sort((a, b) => a.nombre.localeCompare(b.nombre, "es"));

      agregarBurbuja(`Hola${nombreUsuario ? ", " + nombreUsuario : ""}.`, "bot");
      mostrarModulos();
    }

    iniciar();
  </script>
</body>
</html>
