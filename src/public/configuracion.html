<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Configuración — Información Mutual</title>
  <link rel="icon" type="image/png" href="/img/logo-mutual.png" />
  <script>
    (function () {
      var t = localStorage.getItem("tema");
      if (t) document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="barra">
    <div class="barra-izq">
      <img src="/img/logo-blanco.png" alt="Logo Mutual" class="logo-barra" />
      <h1>Configuración</h1>
      <span class="saludo" id="saludo"></span>
    </div>
  </header>

  <main>
    <div class="caja-config">
      <div class="fila-config">
        <div class="fila-config-texto">
          <strong>Apariencia</strong>
          <span>Elegí cómo se ve la aplicación</span>
        </div>
        <div class="selector-tema">
          <button id="btnTemaClaro" data-tema="claro" class="activo">☀️ Claro</button>
          <button id="btnTemaOscuro" data-tema="oscuro">🌙 Oscuro</button>
        </div>
      </div>
    </div>

    <div class="caja-config caja-config-perfil">
      <strong class="caja-config-titulo">Datos personales</strong>

      <div class="perfil-avatar-fila">
        <div class="perfil-avatar" id="perfilAvatar">🙂</div>
        <div class="perfil-avatar-botones">
          <label class="btn-nuevo-chat perfil-btn-foto">
            Cambiar foto
            <input type="file" id="inputFotoPerfil" accept="image/jpeg,image/png,image/webp" hidden />
          </label>
          <button type="button" id="btnQuitarFoto" class="btn-nuevo-chat" hidden>Quitar foto</button>
        </div>
      </div>
      <span class="perfil-ayuda">JPG, PNG o WEBP, máx. 2MB.</span>

      <form id="formPerfil" class="perfil-campos">
        <label class="perfil-campo">
          <span>Teléfono</span>
          <input type="tel" id="inputTelefono" placeholder="Ej: 3401 123456" maxlength="30" />
        </label>
        <label class="perfil-campo">
          <span>Email</span>
          <input type="email" id="inputEmail" placeholder="nombre@mutual.com.ar" maxlength="150" />
        </label>
        <label class="perfil-campo">
          <span>Fecha de nacimiento</span>
          <input type="date" id="inputFechaNacimiento" />
        </label>
        <button type="submit" class="btn-inferior principal perfil-btn-guardar">Guardar</button>
        <span id="perfilMensaje" class="perfil-mensaje" hidden></span>
      </form>
    </div>
  </main>

  <footer class="barra-inferior">
    <a href="/" class="btn-inferior principal">⌂ Menú principal</a>
    <button id="btnSalir" class="btn-inferior peligro">Cerrar sesión</button>
  </footer>

  <script src="/comun.js"></script>
  <script>
    const botonesTema = [document.getElementById("btnTemaClaro"), document.getElementById("btnTemaOscuro")];
    const perfilAvatar = document.getElementById("perfilAvatar");
    const inputFotoPerfil = document.getElementById("inputFotoPerfil");
    const btnQuitarFoto = document.getElementById("btnQuitarFoto");
    const formPerfil = document.getElementById("formPerfil");
    const inputTelefono = document.getElementById("inputTelefono");
    const inputEmail = document.getElementById("inputEmail");
    const inputFechaNacimiento = document.getElementById("inputFechaNacimiento");
    const perfilMensaje = document.getElementById("perfilMensaje");

    function marcarTemaActivo(tema) {
      for (const boton of botonesTema) {
        boton.classList.toggle("activo", boton.dataset.tema === tema);
      }
    }

    function pintarAvatar(fotoUrl) {
      if (fotoUrl) {
        perfilAvatar.innerHTML = `<img src="${fotoUrl}" alt="Foto de perfil" />`;
        btnQuitarFoto.hidden = false;
      } else {
        perfilAvatar.textContent = "🙂";
        btnQuitarFoto.hidden = true;
      }
    }

    async function cargarConfiguracion() {
      try {
        const respuesta = await fetch("/api/config");
        if (!respuesta.ok) return;
        const datos = await respuesta.json();
        marcarTemaActivo(datos.tema);
        inputTelefono.value = datos.telefono || "";
        inputEmail.value = datos.email || "";
        inputFechaNacimiento.value = datos.fechaNacimiento || "";
        pintarAvatar(datos.fotoUrl);
      } catch (error) {
        // Se queda con los defaults si falla.
      }
    }

    async function elegirTema(tema) {
      document.documentElement.setAttribute("data-theme", tema);
      localStorage.setItem("tema", tema);
      marcarTemaActivo(tema);

      await fetch("/api/config", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tema }),
      });
    }

    function mostrarMensajePerfil(texto, esError) {
      perfilMensaje.textContent = texto;
      perfilMensaje.classList.toggle("error", !!esError);
      perfilMensaje.hidden = false;
      setTimeout(() => (perfilMensaje.hidden = true), 3000);
    }

    for (const boton of botonesTema) {
      boton.addEventListener("click", () => elegirTema(boton.dataset.tema));
    }

    inputFotoPerfil.addEventListener("change", async () => {
      const archivo = inputFotoPerfil.files[0];
      if (!archivo) return;

      const datos = new FormData();
      datos.append("foto", archivo);
      const respuesta = await fetch("/api/config/foto", { method: "POST", body: datos });
      inputFotoPerfil.value = "";

      if (!respuesta.ok) {
        const error = await respuesta.json().catch(() => ({}));
        mostrarMensajePerfil(error.error || "No se pudo subir la foto", true);
        return;
      }
      const { fotoUrl } = await respuesta.json();
      pintarAvatar(fotoUrl);
      mostrarMensajePerfil("Foto actualizada");
    });

    btnQuitarFoto.addEventListener("click", async () => {
      const respuesta = await fetch("/api/config/foto", { method: "DELETE" });
      if (respuesta.ok) pintarAvatar(null);
    });

    formPerfil.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const respuesta = await fetch("/api/config/perfil", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          telefono: inputTelefono.value.trim(),
          email: inputEmail.value.trim(),
          fechaNacimiento: inputFechaNacimiento.value,
        }),
      });

      if (!respuesta.ok) {
        const error = await respuesta.json().catch(() => ({}));
        mostrarMensajePerfil(error.error || "No se pudo guardar", true);
        return;
      }
      mostrarMensajePerfil("Datos guardados");
    });

    cargarConfiguracion();
  </script>
</body>
</html>
