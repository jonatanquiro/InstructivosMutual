<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat — Información Mutual</title>
  <link rel="icon" type="image/png" href="/img/logo-mutual.png" />
  <script>
    (function () {
      var t = localStorage.getItem("tema");
      if (t) document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="barra">
    <div class="barra-izq">
      <img src="/img/logo-blanco.png" alt="Logo Mutual" class="logo-barra" />
      <h1>Chat</h1>
      <span class="saludo" id="saludo"></span>
    </div>
  </header>

  <main class="main-chat-app">
    <div class="chat-app">
      <aside class="chat-lista">
        <div class="chat-lista-header">
          <span>Conversaciones</span>
          <div class="chat-lista-header-botones">
            <button type="button" id="btnNuevoChat" class="btn-nuevo-chat" title="Nuevo chat privado">+ Chat</button>
            <button type="button" id="btnNuevoGrupo" class="btn-nuevo-chat" title="Nuevo grupo">+ Grupo</button>
          </div>
        </div>
        <div id="pickerUsuarios" class="chat-picker-usuarios" hidden></div>
        <div id="pickerGrupo" class="chat-picker-usuarios chat-picker-grupo" hidden>
          <input type="text" id="inputNombreGrupo" class="chat-input-nombre-grupo" placeholder="Nombre del grupo" maxlength="150" />
          <div id="listaCheckboxesGrupo" class="chat-lista-checkboxes"></div>
          <button type="button" id="btnCrearGrupo" class="btn-inferior principal chat-btn-crear-grupo">Crear grupo</button>
        </div>
        <div id="listaConversaciones" class="chat-lista-items"></div>
      </aside>

      <section class="chat-panel">
        <div class="chat-panel-header">
          <button type="button" id="btnVolverLista" class="btn-volver-lista" title="Volver a conversaciones">←</button>
          <div>
            <div id="chatPanelHeader">Elegí una conversación</div>
            <div id="chatPanelSubtitulo" class="chat-panel-subtitulo"></div>
          </div>
          <button type="button" id="btnBorrarConversacion" class="btn-borrar-conversacion" hidden title="Borrar todos los mensajes de esta conversación">🗑️ Borrar</button>
        </div>
        <div class="chat-mensajes" id="chatMensajes"></div>
        <form id="formEnviar" class="chat-form-envio">
          <div class="chat-emoji-wrap">
            <button type="button" id="btnEmoji" class="chat-btn-adjuntar" title="Emojis">😀</button>
            <div id="panelEmojis" class="chat-panel-emojis" hidden>
              <div class="chat-panel-emojis-header">
                <span>Emojis</span>
                <button type="button" id="btnCerrarEmojis" class="chat-cerrar-emojis" title="Cerrar">✕</button>
              </div>
              <div id="gridEmojis" class="chat-grid-emojis"></div>
            </div>
          </div>
          <label class="chat-btn-adjuntar" title="Adjuntar imagen">
            📎
            <input type="file" id="inputImagen" accept="image/jpeg,image/png,image/webp,image/gif" hidden />
          </label>
          <span id="nombreImagenElegida" class="chat-nombre-imagen" hidden></span>
          <input type="text" id="inputTexto" class="chat-input-texto" placeholder="Escribí un mensaje…" autocomplete="off" enterkeyhint="send" />
          <button type="submit" class="chat-btn-enviar" title="Enviar" aria-label="Enviar">➤</button>
        </form>
      </section>
    </div>
  </main>

  <footer class="barra-inferior">
    <a href="/" class="btn-inferior principal">⌂ Menú principal</a>
    <button id="btnSalir" class="btn-inferior peligro">Cerrar sesión</button>
  </footer>

  <script src="/comun.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    let usuarioId = null;
    let conversaciones = [];
    let conversacionActualId = null;
    let ultimoMensajeId = 0;
    let intervaloMensajes = null;
    let intervaloConversaciones = null;
    let socket = null;
    let noLeidosOtrasConversaciones = 0;
    let primeraCargaConversaciones = true;
    const tituloOriginal = document.title;
    const burbujasPropiasSinVisto = new Map();

    const listaConversaciones = document.getElementById("listaConversaciones");
    const chatMensajes = document.getElementById("chatMensajes");
    const chatPanelHeader = document.getElementById("chatPanelHeader");
    const chatPanelSubtitulo = document.getElementById("chatPanelSubtitulo");
    const formEnviar = document.getElementById("formEnviar");
    const inputTexto = document.getElementById("inputTexto");
    const btnEmoji = document.getElementById("btnEmoji");
    const panelEmojis = document.getElementById("panelEmojis");
    const gridEmojis = document.getElementById("gridEmojis");
    const btnCerrarEmojis = document.getElementById("btnCerrarEmojis");
    const inputImagen = document.getElementById("inputImagen");
    const nombreImagenElegida = document.getElementById("nombreImagenElegida");
    const btnNuevoChat = document.getElementById("btnNuevoChat");
    const pickerUsuarios = document.getElementById("pickerUsuarios");
    const btnNuevoGrupo = document.getElementById("btnNuevoGrupo");
    const pickerGrupo = document.getElementById("pickerGrupo");
    const inputNombreGrupo = document.getElementById("inputNombreGrupo");
    const listaCheckboxesGrupo = document.getElementById("listaCheckboxesGrupo");
    const btnCrearGrupo = document.getElementById("btnCrearGrupo");
    const btnBorrarConversacion = document.getElementById("btnBorrarConversacion");
    const btnVolverLista = document.getElementById("btnVolverLista");
    const chatApp = document.querySelector(".chat-app");

    function tituloConversacion(conversacion) {
      if (conversacion.tipo === "privada") return conversacion.otro_nombre_completo;
      return conversacion.nombre;
    }

    function subtituloPresencia(conversacion) {
      if (conversacion.tipo === "privada") return conversacion.otro_en_linea ? "🟢 En línea" : "";
      if (conversacion.tipo === "grupo") return `${conversacion.en_linea_count} de ${conversacion.total_participantes} en línea`;
      return "";
    }

    function previewConversacion(conversacion) {
      if (conversacion.ultimo_texto) return conversacion.ultimo_texto;
      if (conversacion.ultimo_imagen_archivo) return "📷 Imagen";
      return "Sin mensajes todavía";
    }

    // Avatar chico y redondo: foto si hay, si no la inicial del nombre. Se
    // reusa en la lista de conversaciones, los buscadores de "+ Chat"/
    // "+ Grupo" y el nombre de cada mensaje.
    function avatarHtml(fotoUrl, nombre, chico) {
      const clase = "chat-avatar" + (chico ? " chat-avatar-chico" : "");
      if (fotoUrl) return `<img src="${fotoUrl}" class="${clase}" alt="" />`;
      const inicial = (nombre || "?").trim().charAt(0).toUpperCase() || "?";
      return `<span class="${clase}">${inicial}</span>`;
    }

    function pintarListaConversaciones() {
      listaConversaciones.innerHTML = "";
      for (const conversacion of conversaciones) {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "chat-item-conversacion" + (conversacion.id === conversacionActualId ? " activa" : "");
        const punto = conversacion.tipo === "privada" && conversacion.otro_en_linea ? "🟢 " : "";
        const avatar =
          conversacion.tipo === "privada"
            ? avatarHtml(conversacion.otro_foto_url, conversacion.otro_nombre_completo)
            : `<span class="chat-avatar">👥</span>`;
        item.innerHTML = `
          ${avatar}
          <span class="chat-item-textos">
            <span class="chat-item-titulo">${punto}${tituloConversacion(conversacion)}</span>
            <span class="chat-item-preview">${previewConversacion(conversacion)}</span>
          </span>
        `;
        if (conversacion.no_leidos > 0) {
          const badge = document.createElement("span");
          badge.className = "chat-badge-no-leidos";
          badge.textContent = conversacion.no_leidos > 9 ? "9+" : conversacion.no_leidos;
          item.appendChild(badge);
        }
        item.addEventListener("click", () => abrirConversacion(conversacion.id));
        listaConversaciones.appendChild(item);
      }
    }

    function avisarMensajeNuevo() {
      reproducirBeep();
    }

    // Título tipo "viejo Facebook": mientras haya no leídos en OTRAS
    // conversaciones, se ve el número en la pestaña, se esté mirando el
    // chat o no. No es un parpadeo: se actualiza solo cuando cambia el total.
    function actualizarTituloNoLeidos(total) {
      document.title = total > 0 ? `${tituloOriginal} (${total > 99 ? "99+" : total})` : tituloOriginal;
    }

    function reproducirBeep() {
      try {
        const contexto = new (window.AudioContext || window.webkitAudioContext)();
        const oscilador = contexto.createOscillator();
        const volumen = contexto.createGain();
        oscilador.frequency.value = 880;
        volumen.gain.setValueAtTime(0.15, contexto.currentTime);
        volumen.gain.exponentialRampToValueAtTime(0.001, contexto.currentTime + 0.25);
        oscilador.connect(volumen).connect(contexto.destination);
        oscilador.start();
        oscilador.stop(contexto.currentTime + 0.25);
      } catch (error) {
        // Si el navegador todavía no permite audio (sin interacción previa
        // del usuario), no rompemos nada: simplemente no suena.
      }
    }

    async function cargarConversaciones() {
      const respuesta = await fetch("/api/chat/conversaciones");
      if (respuesta.status === 401) {
        window.location.href = "/login.html";
        return;
      }
      conversaciones = await respuesta.json();
      pintarListaConversaciones();

      const totalOtras = conversaciones
        .filter((c) => c.id !== conversacionActualId)
        .reduce((suma, c) => suma + (c.no_leidos || 0), 0);
      if (!primeraCargaConversaciones && totalOtras > noLeidosOtrasConversaciones) avisarMensajeNuevo();
      noLeidosOtrasConversaciones = totalOtras;
      primeraCargaConversaciones = false;
      actualizarTituloNoLeidos(totalOtras);

      if (conversacionActualId) {
        const actual = conversaciones.find((c) => c.id === conversacionActualId);
        if (actual) chatPanelSubtitulo.textContent = subtituloPresencia(actual);
      }
    }

    function scrollAbajo() {
      chatMensajes.scrollTop = chatMensajes.scrollHeight;
    }

    function agregarMensaje(mensaje) {
      const burbuja = document.createElement("div");
      const esPropio = mensaje.usuario_id === usuarioId;
      burbuja.className = "burbuja " + (esPropio ? "burbuja-usuario" : "burbuja-bot");

      const autor = document.createElement("div");
      autor.className = "chat-autor";
      if (esPropio) {
        autor.textContent = "Vos";
      } else {
        autor.innerHTML = avatarHtml(mensaje.foto_url, mensaje.nombre_completo, true);
        autor.appendChild(document.createTextNode(mensaje.nombre_completo));
      }
      burbuja.appendChild(autor);

      if (mensaje.texto) {
        const texto = document.createElement("div");
        texto.style.whiteSpace = "pre-wrap";
        texto.textContent = mensaje.texto;
        burbuja.appendChild(texto);
      }

      if (mensaje.imagen_archivo) {
        const enlace = document.createElement("a");
        enlace.href = `/uploads/chat/${mensaje.imagen_archivo}`;
        enlace.target = "_blank";
        enlace.rel = "noopener";
        const imagen = document.createElement("img");
        imagen.src = `/uploads/chat/${mensaje.imagen_archivo}`;
        imagen.className = "chat-imagen-mensaje";
        enlace.appendChild(imagen);
        burbuja.appendChild(enlace);
      }

      if (esPropio && mensaje.visto !== undefined) {
        const check = document.createElement("span");
        check.className = "chat-check" + (mensaje.visto ? " visto" : "");
        check.textContent = mensaje.visto ? "✓✓" : "✓";
        burbuja.appendChild(check);
        if (!mensaje.visto) burbujasPropiasSinVisto.set(mensaje.id, check);
      }

      chatMensajes.appendChild(burbuja);
      ultimoMensajeId = Math.max(ultimoMensajeId, mensaje.id);
    }

    async function actualizarVistos() {
      if (!conversacionActualId || burbujasPropiasSinVisto.size === 0) return;
      const respuesta = await fetch(`/api/chat/conversaciones/${conversacionActualId}/lecturas`);
      if (!respuesta.ok) return;
      const lecturas = await respuesta.json();
      if (lecturas.length === 0) return;

      for (const [mensajeId, check] of burbujasPropiasSinVisto) {
        const visto = lecturas.every((otro) => otro.ultimo_mensaje_id >= mensajeId);
        if (visto) {
          check.textContent = "✓✓";
          check.classList.add("visto");
          burbujasPropiasSinVisto.delete(mensajeId);
        }
      }
    }

    async function abrirConversacion(id, { navegarEnMobile = true } = {}) {
      conversacionActualId = id;
      ultimoMensajeId = 0;
      chatMensajes.innerHTML = "";
      burbujasPropiasSinVisto.clear();
      const conversacion = conversaciones.find((c) => c.id === id);
      chatPanelHeader.textContent = conversacion ? tituloConversacion(conversacion) : "";
      chatPanelSubtitulo.textContent = conversacion ? subtituloPresencia(conversacion) : "";
      btnBorrarConversacion.hidden = false;
      // En celular, la lista y el panel del chat ocupan toda la pantalla por
      // turnos (como WhatsApp); en desktop esta clase no cambia nada visual.
      // navegarEnMobile=false se usa solo al abrir "General" automáticamente
      // al cargar la página, para no saltar de una a la conversación sin
      // que el usuario la haya elegido.
      if (navegarEnMobile) chatApp.classList.add("chat-conversacion-abierta");
      pintarListaConversaciones();

      const respuesta = await fetch(`/api/chat/conversaciones/${id}/mensajes`);
      if (respuesta.status === 401) {
        window.location.href = "/login.html";
        return;
      }
      const mensajes = await respuesta.json();
      mensajes.forEach(agregarMensaje);
      scrollAbajo();

      reiniciarPollingMensajes();
    }

    async function revisarMensajesNuevos() {
      if (!conversacionActualId) return;
      const respuesta = await fetch(`/api/chat/conversaciones/${conversacionActualId}/mensajes?despuesDe=${ultimoMensajeId}`);
      if (respuesta.status === 401) {
        window.location.href = "/login.html";
        return;
      }
      const mensajes = await respuesta.json();
      if (mensajes.length > 0) {
        mensajes.forEach(agregarMensaje);
        scrollAbajo();
        if (mensajes.some((m) => m.usuario_id !== usuarioId)) avisarMensajeNuevo();
      }
      actualizarVistos();
    }

    function reiniciarPollingMensajes() {
      if (intervaloMensajes) clearInterval(intervaloMensajes);
      intervaloMensajes = setInterval(revisarMensajesNuevos, 2000);
    }

    // Mensaje que llega por WebSocket (instantáneo, no depende del sondeo
    // de 2s ni de que la pestaña esté en primer plano). El sondeo se deja
    // como respaldo (por si el socket se cae o algo intermedio lo bloquea),
    // así que acá nos cuidamos de no agregar dos veces el mismo mensaje.
    function manejarMensajeNuevoSocket(mensaje) {
      if (mensaje.conversacion_id !== conversacionActualId) {
        // No es la conversación abierta: alcanza con refrescar la lista
        // (actualiza no-leídos, preview, avisa con beep/título si subió el
        // contador) en vez de tocar los mensajes en pantalla.
        cargarConversaciones();
        return;
      }
      if (mensaje.id <= ultimoMensajeId) return; // ya lo agregamos por REST/polling
      agregarMensaje(mensaje);
      scrollAbajo();
      if (mensaje.usuario_id !== usuarioId) {
        avisarMensajeNuevo();
        // Estoy mirando esta conversación ahora mismo: se marca como leída
        // al toque, sin esperar al próximo GET de mensajes.
        socket.emit("marcarLeido", { conversacionId: conversacionActualId, mensajeId: mensaje.id });
      }
    }

    function conectarSocket() {
      socket = io();
      socket.on("mensajeNuevo", manejarMensajeNuevoSocket);
      socket.on("lecturaActualizada", (payload) => {
        if (payload.conversacionId === conversacionActualId) actualizarVistos();
      });
      // Grupo/DM nuevo en el que me incluyeron: refresca la lista para que
      // aparezca sin esperar el sondeo de conversaciones (10s).
      socket.on("conversacionNueva", () => cargarConversaciones());
    }

    // Algunos teclados de celular (sobre todo con predicción/autocorrección
    // activa) no disparan un submit normal del form al tocar Enter/Ir: lo
    // forzamos a mano para que "Enter" siempre mande el mensaje.
    inputTexto.addEventListener("keydown", (evento) => {
      if (evento.key === "Enter" && !evento.shiftKey) {
        evento.preventDefault();
        formEnviar.requestSubmit();
      }
    });

    const EMOJIS = [
      // Caras y emociones
      "😀", "😃", "😄", "😁", "😆", "😅", "🤣", "😂", "🙂", "🙃",
      "😉", "😊", "😇", "🥰", "😍", "🤩", "😘", "😗", "😋", "😛",
      "🤪", "😜", "🤨", "🧐", "🤓", "😎", "🥸", "🤗", "🤔", "🤭",
      "🤫", "🤥", "😐", "😑", "😶", "😏", "😒", "🙄", "😬", "🤐",
      "😔", "😪", "🤤", "😴", "😷", "🤒", "🤕", "🤢", "🥵", "🥶",
      "😵", "🤯", "🥳", "🥺", "😢", "😭", "😤", "😠", "😡", "🤬",
      "😨", "😰", "😥", "😓", "🤫", "🙁", "😞", "😩", "😫", "🥱",
      // Gestos y personas
      "👍", "👎", "👏", "🙌", "🙏", "🤝", "💪", "✌️", "🤞", "👋",
      "👌", "🤙", "☝️", "✋", "🖐️", "👊", "🤷", "🤦", "🧑‍💻", "🕺",
      // Corazones y símbolos
      "❤️", "🧡", "💛", "💚", "💙", "💜", "🖤", "🤍", "💔", "💕",
      "✅", "❌", "⚠️", "❗", "❓", "💯", "🔥", "✨", "🎉", "🎊",
      // Objetos y trabajo (que aparecen bastante en un chat de oficina)
      "📌", "📎", "📅", "🕐", "⏰", "📝", "📄", "📊", "💬", "📞",
      "☕", "🍕", "🎂", "🎁", "🚗", "🏠", "💡", "🔒", "🔑", "👀",
    ];

    function pintarPanelEmojis() {
      if (gridEmojis.childElementCount > 0) return;
      for (const emoji of EMOJIS) {
        const boton = document.createElement("button");
        boton.type = "button";
        boton.textContent = emoji;
        boton.addEventListener("click", () => insertarEmoji(emoji));
        gridEmojis.appendChild(boton);
      }
    }

    function insertarEmoji(emoji) {
      const inicio = inputTexto.selectionStart ?? inputTexto.value.length;
      const fin = inputTexto.selectionEnd ?? inputTexto.value.length;
      inputTexto.value = inputTexto.value.slice(0, inicio) + emoji + inputTexto.value.slice(fin);
      const posicion = inicio + emoji.length;
      inputTexto.focus();
      inputTexto.setSelectionRange(posicion, posicion);
    }

    btnEmoji.addEventListener("click", (evento) => {
      evento.stopPropagation();
      pintarPanelEmojis();
      panelEmojis.hidden = !panelEmojis.hidden;
    });

    btnCerrarEmojis.addEventListener("click", () => {
      panelEmojis.hidden = true;
    });

    document.addEventListener("click", (evento) => {
      if (!panelEmojis.hidden && !panelEmojis.contains(evento.target) && evento.target !== btnEmoji) {
        panelEmojis.hidden = true;
      }
    });

    inputImagen.addEventListener("change", () => {
      const archivo = inputImagen.files[0];
      if (archivo) {
        nombreImagenElegida.textContent = archivo.name + " ✕";
        nombreImagenElegida.hidden = false;
      } else {
        nombreImagenElegida.hidden = true;
      }
    });

    nombreImagenElegida.addEventListener("click", () => {
      inputImagen.value = "";
      nombreImagenElegida.hidden = true;
    });

    formEnviar.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      if (!conversacionActualId) return;

      const texto = inputTexto.value.trim();
      const archivo = inputImagen.files[0];
      if (!texto && !archivo) return;

      const datos = new FormData();
      if (texto) datos.append("texto", texto);
      if (archivo) datos.append("imagen", archivo);

      const respuesta = await fetch(`/api/chat/conversaciones/${conversacionActualId}/mensajes`, {
        method: "POST",
        body: datos,
      });

      if (respuesta.status === 401) {
        window.location.href = "/login.html";
        return;
      }
      if (!respuesta.ok) {
        const error = await respuesta.json().catch(() => ({}));
        alert(error.error || "No se pudo enviar el mensaje");
        return;
      }

      const mensaje = await respuesta.json();
      agregarMensaje(mensaje);
      scrollAbajo();
      inputTexto.value = "";
      inputImagen.value = "";
      nombreImagenElegida.hidden = true;
      cargarConversaciones();
    });

    btnNuevoChat.addEventListener("click", async () => {
      pickerGrupo.hidden = true;
      if (!pickerUsuarios.hidden) {
        pickerUsuarios.hidden = true;
        return;
      }
      const respuesta = await fetch("/api/chat/usuarios");
      const usuarios = await respuesta.json();
      pickerUsuarios.innerHTML = "";
      if (usuarios.length === 0) {
        pickerUsuarios.innerHTML = "<div class='chat-picker-vacio'>No hay otros usuarios activos</div>";
      }
      for (const usuario of usuarios) {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "chat-picker-item";
        item.innerHTML =
          avatarHtml(usuario.foto_url, usuario.nombre_completo, true) +
          `<span>${usuario.en_linea ? "🟢 " : ""}${usuario.nombre_completo}</span>`;
        item.addEventListener("click", async () => {
          pickerUsuarios.hidden = true;
          const creacion = await fetch("/api/chat/conversaciones", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ usuarioId: usuario.id }),
          });
          const datos = await creacion.json();
          await cargarConversaciones();
          abrirConversacion(datos.id);
        });
        pickerUsuarios.appendChild(item);
      }
      pickerUsuarios.hidden = false;
    });

    btnNuevoGrupo.addEventListener("click", async () => {
      pickerUsuarios.hidden = true;
      if (!pickerGrupo.hidden) {
        pickerGrupo.hidden = true;
        return;
      }
      const respuesta = await fetch("/api/chat/usuarios");
      const usuarios = await respuesta.json();
      inputNombreGrupo.value = "";
      listaCheckboxesGrupo.innerHTML = "";
      if (usuarios.length === 0) {
        listaCheckboxesGrupo.innerHTML = "<div class='chat-picker-vacio'>No hay otros usuarios activos</div>";
      }
      for (const usuario of usuarios) {
        const label = document.createElement("label");
        label.className = "chat-checkbox-usuario";
        label.innerHTML =
          `<input type="checkbox" value="${usuario.id}" />` +
          avatarHtml(usuario.foto_url, usuario.nombre_completo, true) +
          `<span>${usuario.en_linea ? "🟢 " : ""}${usuario.nombre_completo}</span>`;
        listaCheckboxesGrupo.appendChild(label);
      }
      pickerGrupo.hidden = false;
    });

    btnCrearGrupo.addEventListener("click", async () => {
      const nombre = inputNombreGrupo.value.trim();
      const participantesIds = [...listaCheckboxesGrupo.querySelectorAll("input:checked")].map((c) => Number(c.value));

      if (!nombre) return alert("Ponele un nombre al grupo");
      if (participantesIds.length === 0) return alert("Elegí al menos un participante");

      const creacion = await fetch("/api/chat/grupos", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nombre, participantesIds }),
      });
      if (!creacion.ok) {
        const error = await creacion.json().catch(() => ({}));
        alert(error.error || "No se pudo crear el grupo");
        return;
      }

      const datos = await creacion.json();
      pickerGrupo.hidden = true;
      await cargarConversaciones();
      abrirConversacion(datos.id);
    });

    btnVolverLista.addEventListener("click", () => {
      // Solo oculta el panel y muestra la lista (en desktop no hace nada
      // visualmente): la conversación sigue "abierta" en segundo plano, o
      // sea que el sondeo de mensajes/vistos sigue corriendo igual.
      chatApp.classList.remove("chat-conversacion-abierta");
    });

    btnBorrarConversacion.addEventListener("click", async () => {
      if (!conversacionActualId) return;
      const conversacion = conversaciones.find((c) => c.id === conversacionActualId);
      const nombre = conversacion ? tituloConversacion(conversacion) : "esta conversación";
      if (!confirm(`¿Borrar todos los mensajes de "${nombre}"? No se puede deshacer.`)) return;

      const respuesta = await fetch(`/api/chat/conversaciones/${conversacionActualId}/mensajes`, {
        method: "DELETE",
      });
      if (respuesta.status === 401) {
        window.location.href = "/login.html";
        return;
      }
      if (!respuesta.ok) {
        alert("No se pudieron borrar los mensajes");
        return;
      }

      chatMensajes.innerHTML = "";
      ultimoMensajeId = 0;
      cargarConversaciones();
    });

    async function iniciar() {
      const meRespuesta = await fetch("/api/auth/me");
      if (meRespuesta.status === 401) {
        window.location.href = "/login.html";
        return;
      }
      const me = await meRespuesta.json();
      usuarioId = me.usuarioId;

      conectarSocket();
      await cargarConversaciones();

      const grupal = conversaciones.find((c) => c.tipo === "grupal");
      if (grupal) abrirConversacion(grupal.id, { navegarEnMobile: false });

      intervaloConversaciones = setInterval(cargarConversaciones, 10000);
    }

    // Antes se cortaba todo el sondeo al minimizar/cambiar de pestaña; ahora
    // lo dejamos corriendo para que los mensajes y el "visto" sigan
    // llegando en 2do plano (el navegador igual va a frenar un poco el
    // ritmo de los timers en pestañas ocultas, pero no los va a parar del
    // todo). Al volver a mirar la pestaña, además, refrescamos ya mismo en
    // vez de esperar al próximo tick.
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        if (conversacionActualId) revisarMensajesNuevos();
        cargarConversaciones();
      }
    });

    iniciar();
  </script>
</body>
</html>
